version: 2
updates:
  # The Dockerfile uses alpine:latest, the weekly rebuild picks up new
  # Alpine releases, so only the actions are updated by Dependabot
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # New versions are only proposed after 7 days, so a compromised or
    # broken release is usually withdrawn before it gets here. Security
    # updates are not delayed.
    cooldown:
      default-days: 7
